[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 8 and rolldown require Node ^20.19 || >=22.12 — they import `styleText`
  # from node:util, which does not exist on Node 18. Netlify's build image still
  # defaults to Node 18, so this must be pinned explicitly.
  NODE_VERSION = "22"

# Vite emits content-hashed filenames under /assets, so they are safe to cache
# indefinitely. index.html stays revalidated by Netlify's default.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
